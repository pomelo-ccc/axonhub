name: Deploy AxonHub

on:
  push:
    branches:
      - unstable
      - development
      - 'codex/**'
    paths:
      - '.github/workflows/deploy-axonhub.yml'
      - 'Makefile'
      - 'cmd/**'
      - 'internal/**'
      - 'frontend/**'
      - 'go.mod'
      - 'go.sum'
      - 'llm/**'
      - 'scripts/deploy/**'
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      ref:
        description: Git ref to build and deploy
        required: false
        default: ''
      rollback_target:
        description: Optional backup path or basename to restore
        required: false
        default: ''

permissions:
  contents: read
  actions: read

env:
  GO111MODULE: on

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    name: Build deploy artifact
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload-artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.package-artifact.outputs.archive_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check patch formatting
        run: git diff --check

      - name: Build frontend for /api
        run: VITE_BASE_PATH=/api/ make build-frontend

      - name: Build linux amd64 backend
        run: GOOS=linux GOARCH=amd64 make build-backend

      - name: Package deploy artifact
        id: package-artifact
        run: |
          mkdir -p dist/deploy
          gzip -c ./axonhub > dist/deploy/axonhub.gz
          sha256sum dist/deploy/axonhub.gz > dist/deploy/axonhub.gz.sha256
          printf 'archive_sha256=%s\n' "$(cut -d ' ' -f1 dist/deploy/axonhub.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonhub-linux-amd64
          path: dist/deploy/*
          if-no-files-found: error

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' }}
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production
    concurrency:
      group: axonhub-production
      cancel-in-progress: false
    env:
      AXONHUB_DEPLOY_HOST: ${{ secrets.AXONHUB_DEPLOY_HOST }}
      AXONHUB_DEPLOY_SSH_KEY: ${{ secrets.AXONHUB_DEPLOY_SSH_KEY }}
      AXONHUB_DEPLOY_KNOWN_HOSTS: ${{ secrets.AXONHUB_DEPLOY_KNOWN_HOSTS }}
      AXONHUB_DEPLOY_USER: ${{ vars.AXONHUB_DEPLOY_USER }}
      AXONHUB_DEPLOY_PORT: ${{ vars.AXONHUB_DEPLOY_PORT }}
      AXONHUB_DEPLOY_SERVICE: ${{ vars.AXONHUB_DEPLOY_SERVICE }}
      AXONHUB_DEPLOY_BINARY_PATH: ${{ vars.AXONHUB_DEPLOY_BINARY_PATH }}
      AXONHUB_DEPLOY_BACKUP_DIR: ${{ vars.AXONHUB_DEPLOY_BACKUP_DIR }}
      AXONHUB_DEPLOY_TMP_DIR: ${{ vars.AXONHUB_DEPLOY_TMP_DIR }}
      AXONHUB_LOCAL_HEALTHCHECK_URL: ${{ vars.AXONHUB_LOCAL_HEALTHCHECK_URL }}
      AXONHUB_PUBLIC_HEALTHCHECK_URL: ${{ vars.AXONHUB_PUBLIC_HEALTHCHECK_URL }}
      AXONHUB_SECONDARY_HEALTHCHECK_URL: ${{ vars.AXONHUB_SECONDARY_HEALTHCHECK_URL }}
      AXONHUB_SECONDARY_HEALTHCHECK_STRICT: ${{ vars.AXONHUB_SECONDARY_HEALTHCHECK_STRICT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AXONHUB_DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [[ -n "${AXONHUB_DEPLOY_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${AXONHUB_DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${AXONHUB_DEPLOY_PORT:-22}" -H "${AXONHUB_DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Resolve artifact download URL
        id: artifact-url
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          artifact_api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${{ needs.build.outputs.artifact_id }}/zip"
          artifact_download_url="$(
            curl -fsSI \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${artifact_api_url}" |
            awk 'BEGIN { IGNORECASE = 1 } /^location: / { sub(/\r$/, "", $2); print $2 }'
          )"

          if [[ -z "${artifact_download_url}" ]]; then
            echo "Unable to resolve artifact download URL." >&2
            exit 1
          fi

          printf 'artifact_download_url=%s\n' "${artifact_download_url}" >> "$GITHUB_OUTPUT"

      - name: Deploy artifact
        run: |
          export AXONHUB_DEPLOY_SSH_IDENTITY_FILE="$HOME/.ssh/id_ed25519"
          export AXONHUB_DEPLOY_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          export AXONHUB_DEPLOY_REMOTE_ARCHIVE_URL="${{ steps.artifact-url.outputs.artifact_download_url }}"
          export AXONHUB_DEPLOY_REMOTE_ARCHIVE_KIND="zip"
          export AXONHUB_DEPLOY_REMOTE_ARCHIVE_SHA256="${{ needs.build.outputs.archive_sha256 }}"
          ./scripts/deploy/deploy-production.sh

  rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    name: Roll back production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: axonhub-production
      cancel-in-progress: false
    env:
      AXONHUB_DEPLOY_HOST: ${{ secrets.AXONHUB_DEPLOY_HOST }}
      AXONHUB_DEPLOY_SSH_KEY: ${{ secrets.AXONHUB_DEPLOY_SSH_KEY }}
      AXONHUB_DEPLOY_KNOWN_HOSTS: ${{ secrets.AXONHUB_DEPLOY_KNOWN_HOSTS }}
      AXONHUB_DEPLOY_USER: ${{ vars.AXONHUB_DEPLOY_USER }}
      AXONHUB_DEPLOY_PORT: ${{ vars.AXONHUB_DEPLOY_PORT }}
      AXONHUB_DEPLOY_SERVICE: ${{ vars.AXONHUB_DEPLOY_SERVICE }}
      AXONHUB_DEPLOY_BINARY_PATH: ${{ vars.AXONHUB_DEPLOY_BINARY_PATH }}
      AXONHUB_DEPLOY_BACKUP_DIR: ${{ vars.AXONHUB_DEPLOY_BACKUP_DIR }}
      AXONHUB_DEPLOY_TMP_DIR: ${{ vars.AXONHUB_DEPLOY_TMP_DIR }}
      AXONHUB_LOCAL_HEALTHCHECK_URL: ${{ vars.AXONHUB_LOCAL_HEALTHCHECK_URL }}
      AXONHUB_PUBLIC_HEALTHCHECK_URL: ${{ vars.AXONHUB_PUBLIC_HEALTHCHECK_URL }}
      AXONHUB_SECONDARY_HEALTHCHECK_URL: ${{ vars.AXONHUB_SECONDARY_HEALTHCHECK_URL }}
      AXONHUB_SECONDARY_HEALTHCHECK_STRICT: ${{ vars.AXONHUB_SECONDARY_HEALTHCHECK_STRICT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${AXONHUB_DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [[ -n "${AXONHUB_DEPLOY_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "${AXONHUB_DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${AXONHUB_DEPLOY_PORT:-22}" -H "${AXONHUB_DEPLOY_HOST}" >> ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Roll back artifact
        run: |
          export AXONHUB_DEPLOY_SSH_IDENTITY_FILE="$HOME/.ssh/id_ed25519"
          export AXONHUB_DEPLOY_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          if [[ -n "${{ inputs.rollback_target }}" ]]; then
            ./scripts/deploy/rollback-production.sh "${{ inputs.rollback_target }}"
          else
            ./scripts/deploy/rollback-production.sh
          fi
